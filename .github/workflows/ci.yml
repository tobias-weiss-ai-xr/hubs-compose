name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Top-level validation ────────────────────────────────────────────────

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config
          echo "✅ docker-compose.yml is valid"

      - name: Validate Dockerfiles exist
        run: |
          for df in dockerfiles/*.Dockerfile; do
            [ -f "$df" ] && echo "✅ $(basename $df) exists"
          done

      - name: Check .env.example matches .env keys
        run: |
          if [ -f .env.example ] && [ -f .env ]; then
            missing=$(comm -23 <(grep -v '^#' .env.example | cut -d= -f1 | sort -u) <(grep -v '^#' .env | cut -d= -f1 | sort -u))
            if [ -n "$missing" ]; then
              echo "⚠️  Missing from .env:"
              echo "$missing"
            fi
            echo "✅ .env keys checked"
          fi

  # ── Hubs frontend tests ──────────────────────────────────────────────────

  hubs-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/hubs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: services/hubs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage (thresholds enforced by .c8rc)
        run: npm run test:coverage

  # ── Reticulum backend tests ──────────────────────────────────────────────

  reticulum-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: services/reticulum

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ret_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "25.3"
          elixir-version: "1.14.3"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('services/reticulum/mix.lock') }}-${{ runner.os }}
          restore-keys: |
            mix-${{ runner.os }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Get dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Check formatting
        run: mix format --check-formatted



  # ── Docker image build (no push, just verify it compiles) ─────────────────

  docker-build:
    runs-on: ubuntu-latest
    needs: [hubs-tests, reticulum-tests, validate]
    steps:
      - uses: actions/checkout@v4

      - name: Build hubs image
        run: docker build -f dockerfiles/hubs.Dockerfile -t hubs:test services/hubs

      - name: Build reticulum image
        run: docker build -f services/reticulum/TurkeyDockerfile --target dev -t reticulum:test services/reticulum
