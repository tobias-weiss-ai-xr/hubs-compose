name: hubs-compose

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  coturn:
    build:
      context: /home/weiss/git/hubs-compose
      dockerfile: dockerfiles/coturn.Dockerfile
    depends_on:
      db:
        condition: service_started
        required: true
    environment:
      MAX_PORT: "50050"
      MIN_PORT: "50000"
      PSQL: host=db dbname=ret_dev user=postgres password=postgres options='-c search_path=coturn' connect_timeout=30
      REALM: ret
      TLS_PORT: "5349"
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - localhost
        - "5349"
      interval: 30s
      start_period: 10s
    networks:
      default: null
    ports:
      - "5349:5349/tcp"
      - "50000-50050:50000-50050/tcp"
      - "50000-50050:50000-50050/udp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: volume
        source: coturn
        target: /var/lib/coturn
        volume: {}
  db:
    environment:
      POSTGRES_PASSWORD: postgres
    # Performance tuning for PostgreSQL 14 (conservative small/medium-VPS defaults).
    # Scale shared_buffers (~25% of RAM) and effective_cache_size (~50-75% of RAM) to the host.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "max_connections=200"
    healthcheck:
      test:
        - CMD
        - pg_isready
    image: postgres:14-alpine
    networks:
      default: null
    ports:
      - "5432:5432/tcp"
    restart: unless-stopped
    logging: *default-logging
    user: postgres
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data
        volume: {}
  dialog:
    build:
      context: /home/weiss/git/hubs-compose
      dockerfile: dockerfiles/dialog.Dockerfile
    environment:
      AUTH_KEY: /etc/perms.pub.pem
      HTTPS_CERT_FULLCHAIN: /etc/ssl/fullchain.pem
      HTTPS_CERT_PRIVKEY: /etc/ssl/privkey.pem
      INTERACTIVE: "false"
      MEDIASOUP_ANNOUNCED_IP: 92.208.105.55
      MEDIASOUP_MAX_PORT: "40050"
      MEDIASOUP_MIN_PORT: "40000"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:7000/meta
      interval: 30s
      start_period: 15s
    networks:
      default: null
    ports:
      - "4443:4443/tcp"
      - "40000-40050:40000-40050/tcp"
      - "40000-40050:40000-40050/udp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: bind
        source: /home/weiss/git/hubs-compose/services/dialog
        target: /code
        bind: {}
    working_dir: /code
  grafana:
    environment:
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:3000/api/health
      interval: 30s
      start_period: 15s
    image: grafana/grafana:latest
    networks:
      default: null
    ports:
      - "3333:3000/tcp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: bind
        source: /home/weiss/git/hubs-compose/monitoring/grafana/datasources
        target: /etc/grafana/provisioning/datasources
        bind: {}
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
        volume: {}
  hubs-admin:
    build:
      context: /home/weiss/git/hubs-compose
      dockerfile: dockerfiles/hubs.Dockerfile
    command:
      - npm
      - run
      - local
      - --
      - --allowed-hosts
      - all
    depends_on:
      reticulum:
        condition: service_started
        required: true
    environment:
      INTERNAL_HOSTNAME: hubs-admin
      # Use container name on Docker network
      HUBS_SERVER: "http://reticulum:4001"
    healthcheck:
      test:
        - CMD
        - curl
        - -fk
        - http://localhost:8989/admin.html
    networks:
      default: null
    platform: linux/amd64
    ports:
      - "8989:8989/tcp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: bind
        source: /home/weiss/git/hubs-compose/services/hubs
        target: /code
        bind: {}
    working_dir: /code/admin
  hubs-client:
    build:
      context: /home/weiss/git/hubs-compose
      dockerfile: dockerfiles/hubs.Dockerfile
    command:
      - npm
      - run
      - local
      - --
      - --allowed-hosts
      - all
    depends_on:
      reticulum:
        condition: service_started
        required: true
    environment:
      HUBS_HOST: hubs.chemie-lernen.org
      INTERNAL_HOSTNAME: hubs-client
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Use container name on Docker network
      RETICULUM_SERVER: "http://reticulum:4001"
    healthcheck:
      test:
        - CMD
        - curl
        - -fk
        - http://localhost:8084
      start_period: 3m30s
    networks:
      default: null
    platform: linux/amd64
    ports:
      - "8084:8084/tcp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: bind
        source: /home/weiss/git/hubs-compose/services/hubs
        target: /code
        bind: {}
    working_dir: /code
  hubs-storybook:
    build:
      context: /home/weiss/git/hubs-compose
      dockerfile: dockerfiles/hubs.Dockerfile
    command:
      - sh
      - -c
      - "chown -R node:node /code/node_modules/.cache/storybook 2>/dev/null; WATCHPACK_POLLING=true npm run storybook -- --no-open"
    depends_on:
      hubs-client:
        condition: service_started
        required: false
    healthcheck:
      test:
        - CMD
        - curl
        - -fk
        - http://localhost:6006
    networks:
      default: null
    platform: linux/amd64
    ports:
      - "6006:6006/tcp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: bind
        source: /home/weiss/git/hubs-compose/services/hubs
        target: /code
        bind: {}
    working_dir: /code
  postgrest:
    build:
      context: /home/weiss/git/hubs-compose
      dockerfile: dockerfiles/postgrest.Dockerfile
    depends_on:
      db:
        condition: service_healthy
        required: true
    networks:
      default: null
    restart: unless-stopped
    logging: *default-logging
  node-exporter:
    image: prom/node-exporter:latest
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --web.listen-address=:9110
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9110/metrics
      interval: 30s
      start_period: 5s
    networks:
      default: null
    ports:
      - "9110:9110/tcp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /rootfs
        read_only: true
    platform: linux/amd64
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --storage.tsdb.wal-compression
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consules
      - --web.enable-lifecycle
      - --web.enable-admin-api
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9090/-/healthy
      interval: 30s
      start_period: 15s
    image: prom/prometheus:latest
    networks:
      default: null
    ports:
      - "9092:9090/tcp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: bind
        source: /home/weiss/git/hubs-compose/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        bind: {}
      - type: bind
        source: /home/weiss/git/hubs-compose/monitoring/alert.rules
        target: /etc/prometheus/alert.rules
        bind: {}
      - type: volume
        source: prometheus_data
        target: /prometheus
        volume: {}
    depends_on:
      db:
        condition: service_healthy
  pse-vr:
    container_name: pse-vr
    image: hello-webxr:latest
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:80
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      default: null
    ports:
      - "3000:80/tcp"
    restart: unless-stopped
    logging: *default-logging
  reticulum:
    build:
      context: /home/weiss/git/hubs-compose/services/reticulum
      dockerfile: TurkeyDockerfile
      target: dev
    depends_on:
      db:
        condition: service_started
        required: true
    environment:
      ALLOWED_ORIGINS: '*'
      CORS_ORIGINS: '*'
      DB_CREDENTIALS: postgres
      DB_HOST: db
      DIALOG_HOSTNAME: nearspark.hubs.chemie-lernen.org
      DIALOG_PORT: "443"
      EMAIL_FROM: hubs@tobias-weiss.org
      GUARDIAN_SECRET_KEY: 7GHmazKuDCY9uI3uBEIkxhrKhpTWK6hMosHUg6M7T2xdEg3g6WY/IPkPKxBPwHMl5ha9qoDwpD0AI9qmgVYDNA==
      HUBS_ADMIN_INTERNAL_HOSTNAME: hubs-admin
      HUBS_CLIENT_INTERNAL_HOSTNAME: hubs-client
      HUBS_HOST: hubs.chemie-lernen.org
      PERMS_KEY_PATH: /certs/perms.priv.pem
      POSTGREST_INTERNAL_HOSTNAME: postgrest
      POSTGREST_PASSWORD: FeClM6v3DnbDVXgLDcNiH3sMYa02ucCE
      RETICULUM_ADMIN_KEY: c763d12b11ae66e56bbbe3d55f97c765e8c351cbe8ba602340626ee3e5d4b6a0
      SECRET_KEY_BASE: M9LS9yWwJdM/jsDwXdaT8W2j2796X7/mdfmtPsFnZGJr4OX9RTClkZR3k5gJQKADeyC6WB4DymMnYTTjw3QcVg==
      SMTP_PASSWORD: HubsApp2026
      SMTP_PORT: "587"
      SMTP_SERVER: mail.tobias-weiss.org
      SMTP_USERNAME: hubs@tobias-weiss.org
      SPOKE_INTERNAL_HOSTNAME: spoke
      UPLOAD_ENCRYPTION_KEY: f158064cf74efe889e93ab1121aa7ff510f5faefdb9c38382873fb03d30f0ae3
      VAPID_PRIVATE_KEY: LG9xXvfX69GpasNuTUz7Ax0mYnXkqMcPZ6gw_pUklvs
      VAPID_PUBLIC_KEY: BKrqKDrNIZWgwkDhaN5DOIwr0XrHYi69ss7-KvpA5FZkzPBUEaI1CXtJ9r2svQ1kCiRGKX3I9GrZm_1cM0ZWVcs
      VAPID_SUBJECT: mailto:admin@chemie-lernen.org
    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - --no-verbose
        - --tries=1
        - --spider
        - https://reticulum:4000/stream-offline.png
      interval: 30s
      start_period: 1m0s
    networks:
      default: null
    ports:
      - "4003:4000/tcp"
      - "4002:4001/tcp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: bind
        source: /home/weiss/git/hubs-compose/services/reticulum
        target: /code
        bind: {}
      - type: bind
        source: /home/weiss/git/hubs-compose/services/reticulum/storage/dev
        target: /code/storage/dev
        bind: {}
      - type: bind
        source: /home/weiss/git/hubs-compose/services/dialog/certs
        target: /certs
        read_only: true
        bind: {}
  spoke:
    build:
      context: /home/weiss/git/hubs-compose
      dockerfile: dockerfiles/spoke.Dockerfile
    command:
      - yarn
      - start
    depends_on:
      reticulum:
        condition: service_started
        required: true
    environment:
      BASE_ASSETS_PATH: /spoke/
      CORS_PROXY_SERVER: "reticulum:4002"
      INTERNAL_HOSTNAME: spoke
      ROUTER_BASE_PATH: /spoke
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9090
      interval: 30s
      start_period: 30s
      timeout: 5s
      retries: 3
    networks:
      default: null
    platform: linux/amd64
    ports:
      - "9091:9090/tcp"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - type: bind
        source: /home/weiss/git/hubs-compose/services/spoke
        target: /code
        bind: {}
  db-backup:
    build:
      context: /home/weiss/git/hubs-compose
      dockerfile: Dockerfile.backup
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: ret_dev
      POSTGRES_USER: postgres
      DB_CREDENTIALS: postgres
      BACKUP_DIR: /backups
    healthcheck:
      test:
        - CMD
        - test
        - -x
        - /backup-db.sh
      interval: 30s
      retries: 3
      start_period: 5s
    volumes:
      - type: bind
        source: /home/weiss/git/hubs-compose/backups
        target: /backups
      - type: bind
        source: /home/weiss/git/hubs-compose/scripts
        target: /scripts
        read_only: true
    networks:
      default: null
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - backup
networks:
  default:
    name: hubs-compose
volumes:
  coturn:
    name: hubs-compose_coturn
  grafana_data:
    name: hubs-compose_grafana_data
  pgdata:
    name: hubs-compose_pgdata
  prometheus_data:
    name: hubs-compose_prometheus_data

